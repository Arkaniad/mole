# Release build. One tag produces every artifact the install channels consume:
# archives for the curl installer, a checksum file, .deb and .rpm packages, and a
# Homebrew formula pushed to the tap.
#
# Everything here is derived from the tag, so a release cannot disagree with
# itself about its own version — `mole version` reports what the archive is named.
version: 2

project_name: mole

before:
  hooks:
    - go mod tidy
    # A release that does not pass its own suite is not a release.
    - go test ./...

builds:
  - id: mole
    main: ./cmd/mole
    binary: mole
    env: [CGO_ENABLED=0]
    # No cgo means no libc to match, which is the whole reason the pure-Go SQLite
    # driver was chosen: one static binary per platform, no runtime dependency.
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: mole-mcp
    main: ./cmd/mole-mcp
    binary: mole-mcp
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  # Both binaries in one archive: mole-mcp is useless without the daemon mole
  # provides, and a user who installs one and not the other gets a confusing
  # failure from their editor rather than from a command they ran.
  - id: default
    ids: [mole, mole-mcp]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

nfpms:
  - id: packages
    ids: [mole, mole-mcp]
    package_name: mole
    vendor: Lajos Deme
    homepage: https://github.com/lajosdeme/mole
    maintainer: Lajos Deme <l@deme.ventures>
    description: |-
      Deep-research agent with an enforced budget and verified quotes.
      Decomposes a question, reads sources, checks every claim against the text it
      came from, and reports what its sources disagree about. Runs locally, uses
      your own API keys, and speaks MCP.
    license: Apache-2.0
    section: utils
    formats: [deb, rpm]
    # No dependencies to declare: static binaries.
    contents:
      - src: LICENSE
        dst: /usr/share/doc/mole/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/mole/NOTICE

# A formula rather than a cask, and GoReleaser warns that `brews` is being phased
# out in favour of `homebrew_casks`. Kept deliberately: casks are macOS-only, and a
# formula serves Linux Homebrew from the same definition. Revisit when GoReleaser
# removes it, or when macOS binaries are signed and a cask stops meaning a
# Gatekeeper prompt (see RELEASING notes).
brews:
  - name: mole
    ids: [default]
    repository:
      owner: lajosdeme
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/lajosdeme/mole
    description: Deep-research agent with an enforced budget and verified quotes
    license: Apache-2.0
    test: |
      system "#{bin}/mole", "version"
    install: |
      bin.install "mole"
      bin.install "mole-mcp"

aurs:
  # mole-bin: the release archive, not a source build. AUR convention is that a
  # -bin package installs published binaries, and it is what users on Arch
  # actually want for a Go program — a source build makes every user compile what
  # CI already compiled.
  #
  # GoReleaser generates the PKGBUILD and .SRCINFO with the real checksums from
  # this release and pushes them, which is the only arrangement in which those two
  # files cannot drift from the artifacts they describe. The hand-maintained source
  # package lives in packaging/aur/mole.
  - name: mole-bin
    homepage: https://github.com/lajosdeme/mole
    description: Deep-research agent with an enforced budget and verified quotes
    maintainers:
      - Lajos Deme <l@deme.ventures>
    license: Apache-2.0
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/mole-bin.git
    provides: [mole]
    conflicts: [mole]
    package: |-
      install -Dm755 "./mole" "${pkgdir}/usr/bin/mole"
      install -Dm755 "./mole-mcp" "${pkgdir}/usr/bin/mole-mcp"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/mole-bin/LICENSE"
      install -Dm644 "./NOTICE" "${pkgdir}/usr/share/licenses/mole-bin/NOTICE"

release:
  github:
    owner: lajosdeme
    name: mole
  draft: true
  # Drafted rather than published: a release is the one artifact that cannot be
  # unpublished once somebody's installer has cached it, so it gets a human look
  # before it exists.
  footer: |
    ## Install

    ```sh
    curl -fsSL https://raw.githubusercontent.com/lajosdeme/mole/main/install.sh | sh
    ```

    Or see the [README](https://github.com/lajosdeme/mole#install) for Homebrew,
    AUR, .deb and building from source.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
