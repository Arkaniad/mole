name: release

# Tag-driven. Everything about a release is derived from the tag, so an artifact
# cannot disagree with itself about which version it is.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser derives the changelog from history, and a shallow clone
          # gives it a changelog of one commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the release builds with the version the module
          # declares rather than one pinned in two places that can drift.
          go-version-file: go.mod
          cache: true

      # The suite runs before anything is built, not after. A release is the one
      # artifact that cannot be recalled once an installer has cached it.
      - name: test
        run: go test -race -count=1 ./...

      - name: trust the AUR host key
        # Unconditional. This was gated on `env.AUR_KEY != ''` with AUR_KEY set in
        # the same step — the `if` is evaluated before the step's env exists, so
        # the condition was always false and the step never ran. Adding a known
        # host is harmless when there is no key to push with, and a silently
        # skipped setup step is worse than a redundant one.
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token for the tap repository, not GITHUB_TOKEN: the default token
          # cannot push to another repository, and the Homebrew formula lives in
          # lajosdeme/homebrew-mole.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
